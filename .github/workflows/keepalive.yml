# Keeps the Supabase free-tier project from pausing.
#
# Supabase pauses a free project that lacks "sufficient user database activity
# over the past week", where "a few user requests to the database each day" is
# what keeps it awake. It is a DAILY VOLUME threshold, not a 7-day timer.
#
# DO NOT reduce this to every-other-day. That was the original schedule: one
# request every 2 days (~0.5/day) never left a 7-day gap, every run reported
# success, and the project paused anyway. Four visits a day, each issuing several
# queries, puts activity comfortably above the threshold every single day and
# still leaves room for GitHub to delay or skip individual runs.
#
# NOTE: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. Any push re-enables them, and this workflow can always be started by
# hand from the Actions tab ("Run workflow").
name: Supabase keepalive

on:
  schedule:
    # Every 6 hours, at an off-the-hour minute — the top of the hour is when
    # GitHub's scheduler is most congested and most likely to delay a run.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# No repository permissions needed — this only makes an outbound HTTPS request.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the keepalive endpoint
        env:
          # Override by setting a repository variable named KEEPALIVE_URL
          # (Settings -> Secrets and variables -> Actions -> Variables).
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL || 'https://deal-iq-ai.vercel.app/api/keepalive' }}
        run: |
          set -uo pipefail

          # Up to 3 attempts: a cold serverless start can exceed a short timeout,
          # and one transient failure should not read as "the database is down".
          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $KEEPALIVE_URL"
            body=$(curl --silent --show-error --max-time 60 \
                        --header 'Cache-Control: no-cache' \
                        --write-out '\n%{http_code}' \
                        "$KEEPALIVE_URL") || body=""

            status=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "HTTP $status"
            echo "$payload"

            # The endpoint reports ok:true only after Postgres actually answered.
            # Checking the body matters: a 200 alone could be a cached response
            # that never reached the database.
            if [ "$status" = "200" ] && printf '%s' "$payload" | grep -q '"ok":true'; then
              echo "Supabase reached — project activity recorded."
              exit 0
            fi

            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo "::error::Keepalive failed after 3 attempts. The Supabase project may pause if this keeps failing for 7 days."
          exit 1
